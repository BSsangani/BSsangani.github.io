
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Under Maintenance | Bhavin Sangani</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at top, #172554 0%, transparent 55%),
        #080d1a;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 50px 25px;
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 30px;
      display: grid;
      place-items: center;
      border: 1px solid #334155;
      border-radius: 22px;
      background: #111c32;
      font-size: 34px;
    }

    .label {
      color: #93c5fd;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.1;
      letter-spacing: -2px;
    }

    p {
      max-width: 480px;
      margin: 0 auto;
      color: #aab7ca;
      font-size: 17px;
      line-height: 1.8;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 32px;
      padding: 12px 18px;
      border: 1px solid #26364f;
      border-radius: 30px;
      background: #111c32;
      color: #dbeafe;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 12px #60a5fa;
    }

    footer {
      margin-top: 65px;
      color: #718096;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon" aria-hidden="true">⚙</div>

    <div class="label">Portfolio Update</div>

    <h1>Something better<br>is on the way.</h1>

    <p>
      I'm currently improving my portfolio and updating
      my data analytics projects. I'll be back soon.
      Thank you for your patience!
    </p>

    <div class="status">
      <span class="dot"></span>
      Website under maintenance
    </div>

    <footer>
      Bhavin Sangani &nbsp;·&nbsp; Data Analyst
    </footer>
  </main>
</body>
</html>
